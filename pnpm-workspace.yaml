packages:
  - 'apps/*'
  - 'apps/desktop/sidecar'
  - 'packages/*'
onlyBuiltDependencies:
  - esbuild
  - msw
  - sharp
# Medium-3 (監査対応): postcss <= 8.5.22 が CVE-2026-69153 / GHSA-fxqj-rqcc-2cmp
# (sourceMappingURL 経由で任意の .map ファイルを読める問題, first patched: 8.5.23)。
# 注意: pnpm 10.4.1 は workspace yaml の overrides を lockfile に反映しない（過渡期仕様・実績 2026-08-27）。
# 実効させるため同内容を ルート package.json の pnpm.overrides にも記載している。
# コメントの由来: https://github.com/advisories/GHSA-fxqj-rqcc-2cmp
overrides:
  postcss: 8.5.26
  qs: "^6.14.0"
  # High-2 (監査対応): undici < 7.29.1 にアドバイザリ2件（first patched: 7.29.1）
  # GHSA-rfgv-xxqx-mfg5: DoS via unrequested WebSocket subprotocol (CVE-2026-19534)
  # GHSA-w293-vg96-wgc3: TLS 証明書検証バイパス (CVE-2026-84961)
  # package.json の pnpm.overrides と同内容を維持すること（上記の過渡期仕様）。
  # 実測 2026-10-04 (pnpm 10.4.1, 分離実験): package.json 側は
  # "pnpm field ... ignored" と警告するが lockfile に反映される=実効。
  # 本 yaml 側は 10.4.1 では無視され pnpm 11+ で有効 → 両方書くのが正。
  undici: 7.29.1