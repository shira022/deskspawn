name: Path Leak Guard

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  scan:
    # NOTE: reusable workflow はテンプレート側の develop を参照する。
    # shira022/loop-engineering-template#52 は develop にマージ済み
    # （path-leak-check.yml の内容は旧 feature/path-leak-guard と同一: sha 2b102de）。
    # @main はまだ当該ファイルを含まないため、テンプレートの次回リリース
    # （develop → main）後に @main へ切り替える。
    uses: shira022/loop-engineering-template/.github/workflows/path-leak-check.yml@develop
