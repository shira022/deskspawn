name: CI

on:
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - '.agents/**'
      - 'docs/**'
      - '*.md'
  push:
    branches: [develop, main]
    paths-ignore:
      - '.agents/**'
      - 'docs/**'
      - '*.md'

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: corepack enable && pnpm install --frozen-lockfile
      # tsconfig.json は solution 構成 (files:[] + references) のため、-b なしの tsc は
      # 何もチェックしない no-op になる。tsc -b で apps/web + packages/shared を型チェックする。
      - run: pnpm --filter web exec tsc -b --noEmit

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm --filter web exec vitest run --passWithNoTests

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm --filter web build

  # デスクトップ版フロントの型チェック+ビルド (tsc -b で TS2688 等の型定義漏れも検出)。
  # CIが web のみだと desktop のビルド破損が黙過される事故を防ぐ (実績: 2026-08-05 @types/node 欠落)。
  desktop-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm --filter desktop build

  # sidecar のコンパイル検証 (bun build --compile が通ること)。
  # 未宣言変数の ReferenceError 等は実行時まで出ないが、バンドル破損・構文エラーはここで検出できる。
  sidecar-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # latest は再現性がないため固定 (リポジトリ実績バージョン)
          bun-version: 1.3.14
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: cd apps/desktop && bun build --compile ./sidecar/src/server.ts --outfile /tmp/deskspawn-sidecar-check

  # Rust (Tauri 本体) の検証: cargo check + cargo test を Windows ランナーで実行。
  # 存在しないバージョンが Cargo.lock に混入した場合 (実績: 2026-08-06 v0.4.2 で heck/jni-sys/rustc_version/windows-result が
  # "0.4.2" に誤置換され crates.io 解決不能) は cargo check が即失敗するため、リリース事故を防げる。
  rust-check-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # latest は再現性がないため固定 (リポジトリ実績バージョン)
          bun-version: 1.3.14
      - run: corepack enable && pnpm install --frozen-lockfile
      # tauri-build のビルドスクリプトが frontendDist を要求するため、先に dist を生成する
      - run: pnpm --filter desktop build
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (branch ref, pinned 2026-08-28)
      # externalBin (sidecar exe) を生成 — tauri-build の build.rs が存在を要求する
      - run: cd apps/desktop && bun scripts/build-sidecar.mjs
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

  # バージョン整合チェック (タグ/リリース時の SemVer 不整合事故を防止)
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/check-versions.mjs

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high