# DeskSpawn — AppImage build verification (no tag required)
#
# Why this exists (issue #175):
#   `release.yml` only runs on `v*` tags (or a manual dispatch for an existing
#   tag), so fixing the Linux AppImage bundling required cutting a release just
#   to find out whether the fix worked. This workflow builds **only** the
#   AppImage bundle on the same runner image and uploads it as an artifact, so
#   the fix can be proven before tagging.
#
# What it does NOT do:
#   - it does not create or modify a GitHub Release
#   - it does not require a tag, and it is not part of the release path
#
# Trigger: workflow_dispatch (Actions → "AppImage verify" → Run workflow).

name: AppImage verify

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (branch/SHA) to build; empty = the branch this workflow runs from
        required: false
        type: string
  # Run automatically on pull requests that touch the bundling configuration so
  # regressions surface before a tag exists.
  pull_request:
    paths:
      - '.github/workflows/appimage-verify.yml'
      - '.github/workflows/release.yml'
      - 'apps/desktop/src-tauri/tauri.conf.json'
      - 'apps/desktop/package.json'

concurrency:
  group: appimage-verify-${{ github.event_name == 'workflow_dispatch' && (inputs.ref || github.ref_name) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
          # Must match release.yml: linuxdeploy is a FUSE2 AppImage itself.
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2
      - name: Show FUSE availability (diagnostics for #175)
        run: |
          dpkg -l | grep -i fuse || true
          ls -l /dev/fuse || echo "/dev/fuse not present (APPIMAGE_EXTRACT_AND_RUN will be used)"
      - name: Build frontend dist
        run: pnpm --filter desktop build
      - name: Build sidecar (externalBin)
        run: cd apps/desktop && bun scripts/build-sidecar.mjs
      - name: Build AppImage bundle only
        env:
          # Same fallback as release.yml: extract linuxdeploy instead of mounting.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          set -euo pipefail
          pnpm --filter desktop tauri build --bundles appimage
      - name: Verify the AppImage was produced
        run: |
          set -euo pipefail
          BUNDLE=apps/desktop/src-tauri/target/release/bundle
          mapfile -t files < <(find "$BUNDLE" -type f -name '*.AppImage')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No .AppImage produced. Bundling failed (see the build step log)."
            ls -R "$BUNDLE" || true
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "Produced: $f ($(stat -c%s "$f") bytes)"
            chmod +x "$f"
            # --appimage-extract-and-run makes the check work without FUSE.
            APPIMAGE_EXTRACT_AND_RUN=1 "$f" --appimage-version || true
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deskspawn-appimage
          path: apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7
